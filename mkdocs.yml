site_name: Docs as Code

theme:
  name: readthedocs

plugins:
  - search
  - mermaid2:
      javascript: https://unpkg.com/mermaid@8.14.0/dist/mermaid.min.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - https://unpkg.com/mermaid@8.14.0/dist/mermaid.min.js
  - js/mermaid-init.js

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Требования: project/requirements.md
      - Диаграммы: project/diagrams.md
      - API: api/index.md
      - ML:
        - Model Card: ml/model-card.md
        - Data Sheet: ml/dataset.md
        - Риски: ml/risks.md

